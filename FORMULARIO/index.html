<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Producto</title>
</head>
<body>
    <h1>Registro de Producto</h1>

    <form action="procesar.php" method="post">
        <fieldset>
            <legend>Información General del Producto</legend>

            <label for="nombre_producto">Nombre del producto:</label>
            <input type="text" id="nombre_producto" name="nombre_producto" minlength="3" required><br><br>

            <label for="codigo_producto">Código del producto:</label>
            <input type="text" id="codigo_producto" name="codigo_producto" required><br><br>

            <label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio" min="0" step="0.01" required><br><br>

            <label for="categoria">Categoría:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccione una opción</option>
                <option value="electronica">Electrónica</option>
                <option value="ropa">Ropa y Calzado</option>
                <option value="hogar">Hogar y Oficina</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Detalles Adicionales</legend>

            <label for="fecha_registro">Fecha de registro:</label>
            <input type="date" id="fecha_registro" name="fecha_registro"><br><br>

            <label for="descripcion">Descripción:</label><br>
            <textarea id="descripcion" name="descripcion" rows="4" cols="40" maxlength="250" placeholder="Escriba la descripción (máximo 250 caracteres)"></textarea><br><br>

            <input type="checkbox" id="disponible" name="disponible" value="si">
            <label for="disponible">Disponible</label>
        </fieldset>

        <br>

        <button type="submit">Registrar</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
